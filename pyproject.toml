[project]
name = "memento-s"
version = "0.3.0"
description = "Memento-S Agent"
requires-python = ">=3.12"
dependencies = [
    "typer",
    "rich",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "watchdog",
    "anthropic",
    "openai",
    "litellm>=1.81.10",
    "mcp",
    "tiktoken>=0.7.0,<0.12.0",
    "httpx",
    "beautifulsoup4",
    "markdownify",
    "aiohttp",
    "requests",
    "aiofiles",
    "anyio",
    "pyyaml",
    "python-frontmatter>=1.0.0",
    "google_search_results",
    "crawl4ai",
    "camel-ai",
    "nltk",
    "jieba>=0.42.1",
    "rank-bm25",
    "flet==0.82.0",
    "platformdirs>=4.0.0",
    "loguru>=0.7.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "sqlite-vec>=0.1.0",
    "alembic>=1.12.0",
    "inflection>=0.5.1",
    # IM Platform dependencies
    "websockets>=12.0",
    "lark-oapi>=1.0.0",
]


[project.scripts]
memento = "cli.main:memento_entry"
memento-gui = "gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ─── Flet build（原生 Flutter 应用，单进程单图标）──────────────────────────────
[tool.flet]
app.module_name     = "gui.app"
app.name            = "memento-s"
app.product         = "Memento-S"
app.org             = "com.yangtzeailab.memento-s"
app.bundle_id       = "com.yangtzeailab.memento-s.app"
app.build_version   = "0.3.0"
app.build_number    = 1

[tool.flet.app.macos]
# 高分辨率 + 网络/文件权限（Flet 本地服务需要）
info_plist    = { NSHighResolutionCapable = true }
entitlements  = { "com.apple.security.network.client" = true, "com.apple.security.network.server" = true, "com.apple.security.files.user-selected.read-write" = true }

# ─── Briefcase packaging ───────────────────────────────────────────────────────
[tool.briefcase]
project_name = "Memento-S"
bundle = "com.memento-s"
version = "0.3.0"

[tool.briefcase.app.memento-s]
formal_name = "Memento-S"
description = "Memento-S Agent"
# Entry point: briefcase calls gui.app.main()
main_module = "gui.app"
# All source packages to copy into the bundle
sources = [
    "gui",
    "core",
    "middleware",
    "cli",
    "utils",
    "builtin",
    "daemon",
    "bootstrap",   # bootstrap/ package (was bootstrap.py)
]
requires = [
    "flet>=0.25.0",
    "litellm>=1.81.10",
    "anthropic",
    "openai",
    "typer",
    "rich",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "watchdog",
    "mcp",
    "tiktoken>=0.7.0,<0.12.0",
    "httpx",
    "beautifulsoup4",
    "markdownify",
    "aiohttp",
    "requests",
    "aiofiles",
    "anyio",
    "pyyaml",
    "platformdirs>=4.0.0",
    "loguru>=0.7.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "sqlite-vec>=0.1.0",
    "alembic>=1.12.0",
]

[tool.briefcase.app.memento-s.windows]
# Windows-specific: GUI app (no console window)
console_app = false

# ─── Hatch build ───────────────────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["cli", "core", "middleware", "gui", "utils", "builtin", "daemon"]
include = [
    "bootstrap.py",
    "builtin/skills/**",
]

[tool.hatch.build.targets.sdist]
include = [
    "cli/",
    "core/",
    "middleware/",
    "gui/",
    "utils/",
    "builtin/",
    "daemon/",
    "bootstrap.py",
    "pyproject.toml",
    "README.md",
    "howto.md",
]

[tool.pytest.ini_options]
# asyncio_mode = "auto" so bare ``async def test_*`` functions are collected
# without needing an explicit @pytest.mark.asyncio on every one. The suite was
# written assuming this: 24 async tests across 9 files carry no marker and were
# silently failing with "async def functions are not natively supported" once a
# runnable environment existed. Files that DO carry explicit markers keep
# working unchanged — auto mode only supplies a missing one.
asyncio_mode = "auto"
# Pin the fixture loop scope explicitly; pytest-asyncio 1.x warns when it is
# left unset and defaults may change between releases.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
